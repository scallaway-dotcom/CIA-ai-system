[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cia-control-plane"
version = "0.2.0"
description = "Reviewer-ready local safety-first control-plane starter (not production-ready)"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
cia = "cia_control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
